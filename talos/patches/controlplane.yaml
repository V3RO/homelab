# Shared control-plane-only config. inlineManifests (Cilium bootstrap) are
# intentionally NOT here - they're generated by scripts/render-patches.py
# into generated/cilium-inline-manifests.yaml and stacked as an extra
# --config-patch, since they embed the full contents of bootstrap/cilium/*.
cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: none
  proxy:
    disabled: true
  extraManifests:
    - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
    - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
