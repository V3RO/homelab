# Shared machine-level config applied to every node (control-plane and any
# future worker). https://www.talos.dev/latest/reference/configuration/v1alpha1/config/
machine:
  kubelet:
    extraArgs:
      rotate-server-certificates: true
  nodeLabels:
    topology.kubernetes.io/region: talos
  sysctls:
    fs.inotify.max_user_watches: 1048576
    fs.inotify.max_user_instances: 8192
    net.core.default_qdisc: fq
    net.ipv4.tcp_congestion_control: bbr
    net.ipv4.tcp_fastopen: 3
    net.ipv4.tcp_mtu_probing: 1 # optional
