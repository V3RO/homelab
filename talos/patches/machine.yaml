# Shared machine-level config applied to every node (control-plane and any
# future worker). https://www.talos.dev/latest/reference/configuration/v1alpha1/config/
machine:
  kubelet:
    extraArgs:
      rotate-server-certificates: true
    extraMounts:
      # Required by Longhorn: mounts the data path rshared into the kubelet
      # mount namespace so volume attach/mount propagation works. The
      # directory lives on EPHEMERAL (no dedicated data disk on these hosts).
      # https://longhorn.io/docs/latest/deploy/install/#installing-on-talos-linux
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
  nodeLabels:
    topology.kubernetes.io/region: talos
  sysctls:
    fs.inotify.max_user_watches: 1048576
    fs.inotify.max_user_instances: 8192
    net.core.default_qdisc: fq
    net.ipv4.tcp_congestion_control: bbr
    net.ipv4.tcp_fastopen: 3
    net.ipv4.tcp_mtu_probing: 1 # optional
