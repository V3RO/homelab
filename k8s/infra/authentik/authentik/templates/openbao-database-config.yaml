# Declarative OpenBao config for rotating authentik's CNPG password, managed
# via vault-config-operator instead of one-off `bao write` commands.
#
# DatabaseSecretEngineConfig's rootCredentials secret must be namespace-local
# to the CR (verified against the CRD schema), so this needs its own
# ServiceAccount + Kubernetes-auth role/policy in OpenBao, scoped to exactly
# these two paths — a small, one-time bootstrap step (see BOOTSTRAP.md in
# the openbao chart), separate from the shared vault-config-operator role
# used for cluster-wide config.
#
# NOT WIRED UP YET: authentik-secret still reads AUTHENTIK_POSTGRESQL__PASSWORD
# from cnpg-authentik-credentials (Bitwarden). Cutting Authentik over to the
# OpenBao-issued credential, and deciding how it picks up future rotations
# (Reloader vs. long rotation_period + manual restart), are separate,
# deliberate steps — not done by this file existing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-openbao
  namespace: {{ .Release.Namespace }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: DatabaseSecretEngineConfig
metadata:
  name: authentik-postgres
  namespace: {{ .Release.Namespace }}
spec:
  authentication:
    path: kubernetes
    role: authentik-db-config
    serviceAccount:
      name: authentik-openbao
  path: database
  pluginName: postgresql-database-plugin
  allowedRoles:
    - authentik-static
  connectionURL: "postgresql://{{ `{{username}}` }}:{{ `{{password}}` }}@authentik-postgres-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/authentik?sslmode=require"
  username: openbao-admin
  rootCredentials:
    secret:
      name: cnpg-openbao-admin-credentials
    passwordKey: password
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: DatabaseSecretEngineStaticRole
metadata:
  name: authentik-static
  namespace: {{ .Release.Namespace }}
spec:
  authentication:
    path: kubernetes
    role: authentik-db-config
    serviceAccount:
      name: authentik-openbao
  path: database
  dBName: authentik-postgres
  username: authentik
  # Conservative default pending the Reloader-vs-manual-restart decision —
  # see openbao's BOOTSTRAP.md. Kubernetes env vars from secretKeyRef don't
  # hot-reload, so raising this without also solving that problem turns
  # every rotation into a recurring self-inflicted outage.
  rotationPeriod: 2592000 # 30 days
