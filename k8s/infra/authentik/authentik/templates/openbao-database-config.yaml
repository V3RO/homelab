# Declarative OpenBao config for authentik's CNPG database, managed via
# vault-config-operator instead of one-off `bao write` commands.
#
# What this provides today: a database connection (DatabaseSecretEngineConfig)
# plus on-demand dev credentials (DatabaseSecretEngineRole dev_ro/dev_rw).
# It does NOT rotate authentik's own application password — see the notes at
# the bottom of this file for why, and what that would take.
#
# DatabaseSecretEngineConfig's rootCredentials secret must be namespace-local
# to the CR (verified against the CRD schema), so this needs its own
# ServiceAccount + Kubernetes-auth role/policy in OpenBao, scoped to exactly
# the paths below.
#
# The Policy and KubernetesAuthEngineRole below are created using the
# shared vault-config-operator bootstrap ServiceAccount (its policy already
# covers auth/kubernetes/role/* and sys/policy/*), which is why they're in
# the vault-config-operator namespace rather than {{ .Release.Namespace }} —
# authentication.serviceAccount is looked up in the CR's own namespace, so
# it has to live where that ServiceAccount actually exists. No manual `bao
# write`/`bao policy write` needed for this part; only the CNPG-side SQL
# (see BOOTSTRAP.md step 6) remains manual, and only for clusters that
# already existed before this pattern — those are raw Postgres privileges
# no OpenBao credential holds until granted. New clusters get them from
# the bootstrap hooks in cluster.yaml, with no manual step at all.
#
# openbao-admin's own password is generated by OpenBao itself (RandomSecret
# below) rather than a Bitwarden-sourced static secret — one fewer static
# secret to maintain, and it's exactly the kind of credential OpenBao is
# meant to own. The kv/data/cnpg/authentik-openbao-admin capabilities below
# are what let RandomSecret write it; the openbao ClusterSecretStore (see
# external-secrets/openbao-config) relays that same value into a
# Kubernetes Secret for CNPG's managed.roles, which only reads from a
# Secret, not from OpenBao directly.
#
# NOT WIRED UP YET: authentik-secret still reads AUTHENTIK_POSTGRESQL__PASSWORD
# from cnpg-authentik-credentials (Bitwarden). Cutting Authentik over to the
# OpenBao-issued credential, and deciding how it picks up future rotations
# (Reloader vs. long rotation_period + manual restart), are separate,
# deliberate steps — not done by this file existing.
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: authentik-db-config
  namespace: vault-config-operator
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: vault-config-operator-controller-manager
  policy: |
    path "database/config/authentik-postgres" {
      capabilities = ["create", "read", "update", "delete"]
    }
    # Dynamic dev roles. "read" matters as well as "create"/"update":
    # vault-config-operator reads before writing on every reconcile.
    #
    # These grant the OPERATOR the right to manage the role definitions.
    # Generating actual credentials (reading database/creds/<role>) is a
    # separate capability held by human logins via the openbao-admins
    # policy — see BOOTSTRAP.md step 3.
    path "database/roles/authentik-dev-ro" {
      capabilities = ["create", "read", "update", "delete"]
    }
    path "database/roles/authentik-dev-rw" {
      capabilities = ["create", "read", "update", "delete"]
    }
    path "kv/data/cnpg/authentik-openbao-admin" {
      capabilities = ["create", "read", "update"]
    }
    path "kv/metadata/cnpg/authentik-openbao-admin" {
      capabilities = ["delete"]
    }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: authentik-db-config
  namespace: vault-config-operator
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: vault-config-operator-controller-manager
  path: kubernetes
  targetServiceAccounts:
    - authentik-openbao
  targetNamespaces:
    targetNamespaces:
      - {{ .Release.Namespace }}
  policies:
    - authentik-db-config
  tokenTTL: 900
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-openbao
  namespace: {{ .Release.Namespace }}
---
# OpenBao generates and owns this password entirely — nothing to seed in
# Bitwarden. Stored at kv/data/cnpg/authentik-openbao-admin.
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: authentik-openbao-admin
  namespace: {{ .Release.Namespace }}
spec:
  authentication:
    path: kubernetes
    role: authentik-db-config
    serviceAccount:
      name: authentik-openbao
  path: kv/data/cnpg
  isKVSecretsEngineV2: true
  secretKey: password
  secretFormat:
    inlinePasswordPolicy: |
      length = 32
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: DatabaseSecretEngineConfig
metadata:
  name: authentik-postgres
  namespace: {{ .Release.Namespace }}
spec:
  authentication:
    path: kubernetes
    role: authentik-db-config
    serviceAccount:
      name: authentik-openbao
  path: database
  pluginName: postgresql-database-plugin
  # Must match the OpenBao role names exactly (metadata.name of the
  # DatabaseSecretEngineRole resources below, since neither sets spec.name).
  # The operator does NOT cross-check this — OpenBao enforces it lazily, at
  # database/creds/<role> read time, so a mismatch surfaces only when you
  # actually try to generate credentials, not when the role is created.
  allowedRoles:
    - authentik-dev-ro
    - authentik-dev-rw
  connectionURL: "postgresql://{{ `{{username}}` }}:{{ `{{password}}` }}@authentik-postgres-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/authentik?sslmode=require"
  username: openbao-admin
  rootCredentials:
    randomSecret:
      name: authentik-openbao-admin
---
# Dynamic dev credentials, generated on demand from the OpenBao UI
# ("Generate credentials" on the role page) or `bao read
# database/creds/authentik-dev-ro`. Each read mints a brand-new Postgres
# login with a random username and a TTL, and OpenBao drops it when the
# lease expires.
#
# Unlike DatabaseSecretEngineStaticRole, these never touch an existing
# role's password, so they cannot fight CNPG's managed.roles — which is
# the failure that caused the 2026-08-24 incident. Nothing here is on the
# path of any running workload; authentik keeps using its own credential.
#
# Postgres role names are intentionally generic (dev_ro/dev_rw, identical
# in every app's cluster). The OpenBao role names must be unique because
# every app shares this one "database" mount, hence the authentik- prefix.
#
# revocationStatements is deliberately omitted. The plugin's default
# revocation ends in DROP ROLE, which always succeeds here because these
# roles hold nothing but a group membership — they only get USAGE on the
# schema, never CREATE, so they can never own an object. (Postgres drops
# role memberships automatically with the role.) Verified on a disposable
# cluster: a DDL-capable ephemeral role could NOT be dropped once it owned
# a table, while these drop cleanly.
#
# Do NOT add an "ALTER DEFAULT PRIVILEGES ... TO <the ephemeral role>"
# creation statement: that writes a pg_default_acl row referencing the
# ephemeral role, which blocks DROP ROLE at lease expiry and strands the
# lease as irrevocable. Default privileges belong on the persistent group
# roles instead (see cluster.yaml).
#
# (Note: Helm evaluates template actions inside YAML comments too, so the
# ephemeral-role placeholder is spelled out in prose here rather than
# written literally — a literal one would break rendering.)
apiVersion: redhatcop.redhat.io/v1alpha1
kind: DatabaseSecretEngineRole
metadata:
  name: authentik-dev-ro
  namespace: {{ .Release.Namespace }}
spec:
  authentication:
    path: kubernetes
    role: authentik-db-config
    serviceAccount:
      name: authentik-openbao
  path: database
  dBName: authentik-postgres
  # These MUST be Go duration strings, not integer seconds — the CRD types
  # them as string/metav1.Duration. "3600" does not parse, and neither does
  # "1d" (Go durations have no day unit). Note this differs from
  # DatabaseSecretEngineStaticRole.rotationPeriod, which really is an int.
  defaultTTL: 1h
  maxTTL: 8h
  # Wrapped in a backtick raw string so Helm passes OpenBao's own name /
  # password / expiration placeholders through verbatim instead of trying
  # to resolve them as Helm variables. IN ROLE grants membership with
  # SET+INHERIT enabled, which is what makes the privileges effective.
  creationStatements:
    - {{ `CREATE ROLE "{{name}}" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}' IN ROLE dev_ro;` | quote }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: DatabaseSecretEngineRole
metadata:
  name: authentik-dev-rw
  namespace: {{ .Release.Namespace }}
spec:
  authentication:
    path: kubernetes
    role: authentik-db-config
    serviceAccount:
      name: authentik-openbao
  path: database
  dBName: authentik-postgres
  defaultTTL: 1h
  maxTTL: 8h
  creationStatements:
    - {{ `CREATE ROLE "{{name}}" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}' IN ROLE dev_rw;` | quote }}
#
# DatabaseSecretEngineStaticRole for "authentik" is DELIBERATELY NOT
# DEPLOYED YET — this caused a live incident (2026-08-24): creating it
# rotates the real Postgres password immediately (not just after
# rotationPeriod elapses), while CNPG's managed.roles was still
# independently asserting the old Bitwarden-sourced password for the same
# role. Both "won" at different points depending on which controller's
# reconcile fired last, and authentik-server's cached connections broke
# when the two disagreed. The rotationPeriod comment below correctly
# predicted this outage class but didn't prevent it, since the very act
# of creating the resource rotates immediately.
#
# A SECOND, independent cause was found later: rotating another role's
# password needs ADMIN OPTION on that role under PG16+ semantics, and the
# manual "GRANT authentik TO openbao-admin WITH ADMIN OPTION" this relied
# on had already been silently revoked by CNPG — it revokes any membership
# not declared in managed.roles[].inRoles, measured at under 10 seconds.
# So this resource could not have worked even without the password fight.
#
# Do not re-add this until, in the same change:
#   1. authentik is removed from authentik-postgres's managed.roles
#      (cluster.yaml) — CNPG must stop being a second writer of this
#      role's password, or they will fight again.
#   2. "authentik" is added to openbao-admin's inRoles AND the
#      "GRANT authentik TO openbao-admin WITH ADMIN OPTION" is applied,
#      in that order. Without the inRoles entry the grant does not
#      survive; without the grant the rotation cannot execute.
#   3. authentik-secret's AUTHENTIK_POSTGRESQL__PASSWORD is switched to
#      read from wherever this resolves to (a Secret relaying
#      database/static-creds/authentik-static, same ExternalSecret
#      pattern as authentik-openbao-admin above).
#   4. Rotation pickup is settled. Note this is easier than previously
#      assumed: authentik re-resolves host/port/user/password on every
#      connection open when the value is a "file://" URI (its custom DB
#      backend calls CONFIG.refresh(); the docs list those four settings
#      as hot-reloadable), so a projected-Secret volume rotates without a
#      restart and without Reloader. Keep CONN_MAX_AGE=0 and avoid
#      subPath mounts, both of which defeat it.
#
# Consider a dynamic role (as used for dev_ro/dev_rw above) instead of a
# static one: it never writes to an existing role's password, so it
# sidesteps cause #1 entirely. It rotates the username too, which is fine
# given the file:// hot-reload above, but it needs the ephemeral role to
# SET ROLE to a persistent owner so migrations don't leave objects owned
# by a credential that is about to expire.
#
# apiVersion: redhatcop.redhat.io/v1alpha1
# kind: DatabaseSecretEngineStaticRole
# metadata:
#   name: authentik-static
#   namespace: {{ .Release.Namespace }}
# spec:
#   authentication:
#     path: kubernetes
#     role: authentik-db-config
#     serviceAccount:
#       name: authentik-openbao
#   path: database
#   dBName: authentik-postgres
#   username: authentik
#   credentialType: password
#   passwordCredentialConfig: {}
#   rotationPeriod: 2592000 # 30 days
