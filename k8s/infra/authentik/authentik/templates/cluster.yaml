apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
  namespace: {{ .Release.Namespace }}
spec:
  instances: 3
  imageName: {{ .Values.postgres.imageName }}

  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.postgres.storage.size }}
      storageClassName: {{ .Values.postgres.storage.class }}
      {{- with .Values.postgres.storage.volumeName }}
      volumeName: {{ . }}
      {{- end }}
  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-authentik-credentials
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  backup:
    schedule: "0 4 * * *"
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://cnpg-backups/authentik/"
      endpointURL: "https://s3.versitygw.schober.dev"
      s3Credentials:
        accessKeyId:
          name: cnpg-authentik-backup-credentials
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-authentik-backup-credentials
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: "gzip"
        maxParallel: 8
