{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: authentik-secret
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecret.data.secretKey | quote }}
    {{- if .Values.externalSecret.data.bootstrapPassword }}
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.data.bootstrapPassword | quote }}
    {{- end }}
    {{- if .Values.externalSecret.data.bootstrapEmail }}
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef:
        key: {{ .Values.externalSecret.data.bootstrapEmail | quote }}
    {{- end }}
    {{- if .Values.externalSecret.data.bootstrapToken }}
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.data.bootstrapToken | quote }}
    {{- end }}
    - secretKey: argocdClientSecret
      remoteRef:
        key: argocd-authentik-client-secret
    - secretKey: grafanaClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.data.grafanaClientSecret | quote }}
    - secretKey: mealieClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.data.mealieClientSecret | quote }}
    - secretKey: zotClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.data.zotClientSecret | quote }}
    - secretKey: forgejoClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.data.forgejoClientSecret | quote }}
    - secretKey: actualClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.data.actualClientSecret | quote }}
    - secretKey: immichClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.data.immichClientSecret | quote }}
    - secretKey: kialiClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.data.kialiClientSecret | quote }}
    - secretKey: openbaoClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.data.openbaoClientSecret | quote }}
    - secretKey: fluxClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.data.fluxClientSecret | quote }}
    {{- range .Values.externalSecret.data.userPasswords }}
    - secretKey: userPassword-{{ .username }}
      remoteRef:
        key: {{ .bitwardenItem | quote }}
    {{- end }}
---
# Authentik's own CNPG database password, generated by OpenBao (RandomSecret
# "application-secret" in openbao-database-config.yaml) rather than sourced
# from a Bitwarden item.
#
# Reloader restarts authentik when this Secret changes — see
# global.deploymentAnnotations in helmrelease.yaml. That annotation is
# required, not optional: AUTHENTIK_POSTGRESQL__PASSWORD is consumed via
# secretKeyRef, and a running process never re-reads an env var. Without the
# restart, CNPG would apply the new password to Postgres while the pods kept
# presenting the old one — and because authentik's liveness probe always
# returns 200 while readiness 503s on a dead DB, the pods would sit NotReady
# forever instead of being restarted by the kubelet.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-authentik-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cnpg-authentik-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # Without this label CNPG applies a password change only "at a
          # subsequent reconciliation" (its own words) rather than
          # immediately. That matters here because Reloader restarts the
          # pods promptly: unlabeled, the new pods would come up holding the
          # new password while Postgres still had the old one, turning a
          # seconds-long cutover into an outage lasting until CNPG next
          # reconciled.
          cnpg.io/reload: "true"
      data:
        username: "authentik"
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: cnpg/authentik/application-secret
        property: password
---
# CNPG's managed.roles only reads a Kubernetes Secret, so this relays the
# password OpenBao itself generated (RandomSecret, in openbao-database-config.yaml)
# back out of OpenBao's kv/cnpg/ into a Secret — no Bitwarden item involved
# at all for this credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-openbao-admin-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cnpg-openbao-admin-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # Same reasoning as above: makes CNPG apply a rotated password
          # promptly, shortening the window where OpenBao's stored
          # credential and Postgres disagree and dev credential generation
          # fails.
          cnpg.io/reload: "true"
      data:
        username: "openbao-admin"
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: cnpg/authentik/openbao-admin
        property: password
{{- end }}
