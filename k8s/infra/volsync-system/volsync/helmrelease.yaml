apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: volsync
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: volsync-repo
        namespace: flux-system
  releaseName: volsync
  targetNamespace: volsync-system
  install:
    createNamespace: true
  dependsOn:
    - name: cert-manager
      namespace: flux-system
    - name: trust-manager
      namespace: flux-system
    - name: bitwarden-issuer
      namespace: flux-system
    - name: cloudflare-issuer
      namespace: flux-system
    - name: external-secrets
      namespace: flux-system
  values:

