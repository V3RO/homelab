# ClusterSecretStore backed by OpenBao, plus the bootstrap Policy/
# KubernetesAuthEngineRole letting External Secrets Operator read
# kv/data/cnpg/* — a one-time-ever piece of infra (not per-app), since
# ESO itself is shared across the whole cluster. Separate Kustomization
# from external-secrets/config (the Bitwarden one) specifically to avoid
# a dependency cycle: openbao's own ks.yaml depends on
# external-secrets-config for its own Bitwarden-sourced secrets, so this
# OpenBao-facing config can't live in the same Kustomization openbao
# itself depends on.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-openbao-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/external-secrets/openbao-config
  prune: true
  dependsOn:
    - name: external-secrets
    - name: openbao
    - name: vault-config-operator
