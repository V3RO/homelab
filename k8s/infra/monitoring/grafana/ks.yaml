apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/monitoring/grafana
  prune: true
  dependsOn:
    - name: namespaces
    # grafana-postgres Cluster CR
    - name: cnpg-operator
    # barmanObjectStore backups and local-path PostgreSQL PVCs
    - name: barman-cloud
    - name: local-path-provisioner
    # OIDC/credential ExternalSecrets
    - name: external-secrets-config
    # HTTPRoute targets the internal Gateway
    - name: gateway
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: grafana
      namespace: flux-system
