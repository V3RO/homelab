apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: ./k8s/infra/monitoring/tempo
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
  releaseName: tempo
  targetNamespace: monitoring
  install:
    createNamespace: true
  dependsOn:
    - name: argo
      namespace: flux-system
  values:
    tempo:
      persistence:
        enabled: true
        storageClassName: local-path
        size: 10Gi

