versitygw:
  replicaCount: 3

  auth:
    existingSecret: versitygw-credentials

  persistence:
    enabled: true
    size: 50Gi
    storageClassName: truenas-nfs-media
    accessMode: ReadWriteMany

  httpRoute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: internal-gateway
        namespace: istio-ingress-internal
        sectionName: versitygw-https
    rules:
      - backendRefs:
          - group: ''
            kind: Service
            name: versitygw
            port: 7070
    hostnames:
      - s3.versitygw.schober.dev

  admin:
    enabled: true
    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: internal-gateway
          namespace: istio-ingress-internal
          sectionName: versitygw-https
      rules:
        - backendRefs:
            - group: ''
              kind: Service
              name: versitygw
              port: 7070
      hostnames:
        - admin.versitygw.schober.dev

  webui:
    enabled: true
    apiGateways:
      - https://s3.versitygw.schober.dev
    adminGateways:
      - https://admin.versitygw.schober.dev
    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: internal-gateway
          namespace: istio-ingress-internal
          sectionName: versitygw-https
      rules:
        - backendRefs:
            - group: ''
              kind: Service
              name: versitygw
              port: 7070
      hostnames:
        - web.versitygw.schober.dev

  # Spread the 3 replicas across 3 distinct nodes since they share one RWX
  # PVC and posix backend directory — colocating replicas defeats the point.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: versitygw
