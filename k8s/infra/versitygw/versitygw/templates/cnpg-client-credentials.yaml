apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: versitygw-client-secret
  namespace: {{ .Release.Namespace }}
spec:
  length: 42
  noUpper: false
  allowRepeat: true
---
{{- range .Values.cnpgClients }}
{{- $app := . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $app }}-versitygw-generated
  namespace: {{ $.Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $app }}-versitygw-generated
    template:
      engineVersion: v2
      data:
        accessKeyId: "{{ $app }}-backup"
        secretAccessKey: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: versitygw-client-secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ $app }}-versitygw-push
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  deletionPolicy: None
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: bitwarden-cnpg-secrets
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ $app }}-versitygw-generated
  data:
    - match:
        secretKey: accessKeyId
        remoteRef:
          remoteKey: {{ $app }}-backup-id
    - match:
        secretKey: secretAccessKey
        remoteRef:
          remoteKey: {{ $app }}-backup-secret
---
{{- end }}
# A SINGLE Job running every app's create-user call sequentially, not one
# Job per app. The S3 IAM backend's users.json has no cross-write locking
# (see BOOTSTRAP.md) -- running 9 create-user Jobs concurrently raced in
# production: each Job's own PATCH genuinely returned 201, but a later
# concurrent write from another Job (landing on a different versitygw
# replica) read a stale users.json and overwrote it, silently dropping
# earlier accounts (sonarr/prowlarr both vanished this way despite their
# own Jobs logging success). One Job, one process, calls made one after
# another -- never more than one in-flight write to users.json from this
# chart at a time.
apiVersion: batch/v1
kind: Job
metadata:
  name: cnpg-clients-create-users
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-users
          image: curlimages/curl:8.11.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: ROOT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: versitygw-credentials
                  key: rootAccessKeyId
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-credentials
                  key: rootSecretAccessKey
            {{- range .Values.cnpgClients }}
            {{- $app := . }}
            - name: {{ $app | upper }}_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $app }}-versitygw-generated
                  key: accessKeyId
            - name: {{ $app | upper }}_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $app }}-versitygw-generated
                  key: secretAccessKey
            {{- end }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              xml_escape() {
                printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e "s/'/\&apos;/g" -e 's/"/\&quot;/g'
              }

              create_user() {
                app=$1
                varprefix=$(echo "$app" | tr '[:lower:]' '[:upper:]')
                access=$(eval "printf '%s' \"\$${varprefix}_ACCESS_KEY_ID\"")
                secret=$(eval "printf '%s' \"\$${varprefix}_SECRET_ACCESS_KEY\"")
                ESCAPED_ACCESS=$(xml_escape "$access")
                ESCAPED_SECRET=$(xml_escape "$secret")
                BODY="<Account><Access>${ESCAPED_ACCESS}</Access><Secret>${ESCAPED_SECRET}</Secret><Role>user</Role></Account>"
                code=$(curl -sS -o /tmp/resp.xml -w '%{http_code}' \
                  --aws-sigv4 "aws:amz:{{ .Values.versitygw.gateway.region }}:s3" \
                  --user "${ROOT_ACCESS_KEY_ID}:${ROOT_SECRET_ACCESS_KEY}" \
                  -X PATCH "http://versitygw.{{ .Release.Namespace }}.svc.cluster.local:7071/create-user" \
                  -H 'Content-Type: application/xml' \
                  --data-binary "$BODY")
                echo "$app -> HTTP $code"; cat /tmp/resp.xml; echo
                case "$code" in
                  201) echo "$app user created" ;;
                  409) echo "$app user already exists, treating as success" ;;
                  *) echo "$app create-user failed"; exit 1 ;;
                esac
              }

              {{- range .Values.cnpgClients }}
              create_user "{{ . }}"
              {{- end }}
