apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: versitygw-client-secret
  namespace: {{ .Release.Namespace }}
spec:
  length: 42
  noUpper: false
  allowRepeat: true
---
{{- range .Values.cnpgClients }}
{{- $app := . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $app }}-versitygw-generated
  namespace: {{ $.Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $app }}-versitygw-generated
    template:
      engineVersion: v2
      data:
        accessKeyId: "{{ $app }}-backup"
        secretAccessKey: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: versitygw-client-secret
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $app }}-versitygw-create-user
  namespace: {{ $.Release.Namespace }}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-user
          image: curlimages/curl:8.11.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: ROOT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: versitygw-credentials
                  key: rootAccessKeyId
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-credentials
                  key: rootSecretAccessKey
            - name: NEW_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $app }}-versitygw-generated
                  key: accessKeyId
            - name: NEW_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $app }}-versitygw-generated
                  key: secretAccessKey
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              BODY="<Account><Access>${NEW_ACCESS_KEY_ID}</Access><Secret>${NEW_SECRET_ACCESS_KEY}</Secret><Role>user</Role></Account>"
              code=$(curl -sS -o /tmp/resp.xml -w '%{http_code}' \
                --aws-sigv4 "aws:amz:us-east-1:s3" \
                --user "${ROOT_ACCESS_KEY_ID}:${ROOT_SECRET_ACCESS_KEY}" \
                -X PATCH "http://versitygw.{{ $.Release.Namespace }}.svc.cluster.local:7071/create-user" \
                -H 'Content-Type: application/xml' \
                --data-binary "$BODY")
              echo "HTTP $code"; cat /tmp/resp.xml; echo
              case "$code" in
                201) echo "user created" ;;
                409) echo "user already exists, treating as success" ;;
                *) echo "create-user failed"; exit 1 ;;
              esac
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ $app }}-versitygw-push
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  deletionPolicy: Delete
  secretStoreRefs:
    - name: bitwarden-cnpg-secrets
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ $app }}-versitygw-generated
  data:
    - match:
        secretKey: accessKeyId
        remoteRef:
          remoteKey: {{ $app }}-backup-id
    - match:
        secretKey: secretAccessKey
        remoteRef:
          remoteKey: {{ $app }}-backup-secret
---
{{- end }}
