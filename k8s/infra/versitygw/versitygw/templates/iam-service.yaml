
apiVersion: v1
kind: Service
metadata:
  name: iam
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - name: s3-api
      port: 7070
      targetPort: s3-api
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
