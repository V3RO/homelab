apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: ./k8s/infra/valkey/valkey
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
  releaseName: valkey
  targetNamespace: valkey
  install:
    createNamespace: true
  dependsOn:
    - name: local-path-provisioner
      namespace: flux-system
    - name: snapshot-controller
      namespace: flux-system
    - name: democratic-csi-nfs
      namespace: flux-system
    - name: democratic-csi-iscsi
      namespace: flux-system
    - name: volsync
      namespace: flux-system
  values:
    valkey:
      auth:
        enabled: true
        usersExistingSecret: valkey-auth
        aclUsers:
          default:
            permissions: "~* &* +@all"
            passwordKey: valkey-password

      replica:
        enabled: true
        replicas: 2
        replicationUser: default
        persistence:
          size: 2Gi
          storageClass: local-path

      valkeyConfig: |-
        # Enable AOF persistence for better durability
        appendonly yes
        # Disable snapshots since AOF is enabled
        save ""
        # Cap memory usage to keep the cache lightweight
        maxmemory 256mb
        maxmemory-policy allkeys-lru

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

      metrics:
        enabled: true

      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1

      # Spread the 3 pods across distinct nodes when possible, without blocking
      # scheduling (or a rollout) if a matching node isn't free.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: valkey
                    app.kubernetes.io/instance: valkey
                topologyKey: kubernetes.io/hostname

