apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: valkey
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  path: ./k8s/infra/valkey/valkey
  prune: true
  dependsOn:
    - name: namespaces
    # PVCs use the local-path storage class
    - name: local-path-provisioner
    # valkey-auth ExternalSecret
    - name: external-secrets-config
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: valkey
      namespace: flux-system
