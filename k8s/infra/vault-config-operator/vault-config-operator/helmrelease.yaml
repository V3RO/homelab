apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-config-operator
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: vault-config-operator
      version: "1.0.2"
      sourceRef:
        kind: HelmRepository
        name: vault-config-operator-repo
        namespace: flux-system
  releaseName: vault-config-operator
  targetNamespace: vault-config-operator
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    crds: CreateReplace
  values:
    # Webhook serving cert via cert-manager's self-signed Issuer + cainjector
    # (both already running in this cluster) rather than a bundled cert
    # generation job.
    enableCertManager: true
    # No ServiceMonitor CRD installed in this cluster.
    enableMonitoring: false
    env:
      - name: VAULT_ADDR
        value: https://openbao.schober.dev
    resources:
      requests:
        cpu: 100m
        memory: 250Mi
      limits:
        cpu: 250m
        memory: 250Mi
