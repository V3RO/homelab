apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden-issuer
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: ./k8s/infra/cert-manager/bitwarden-issuer
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
  releaseName: bitwarden-issuer
  targetNamespace: cert-manager
  install:
    createNamespace: true
  dependsOn:
    - name: cert-manager
      namespace: flux-system
      namespace: flux-system

