apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: trust-manager
      version: "v0.22.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  releaseName: trust-manager
  targetNamespace: cert-manager
  install:
    createNamespace: true
  dependsOn:
    - name: base
      namespace: flux-system
    - name: istiod
      namespace: flux-system
    - name: cni
      namespace: flux-system
    - name: ztunnel
      namespace: flux-system
  values:
    crds:
      enabled: true


