apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: local-path-provisioner
      version: "0.0.36"
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner-repo
        namespace: flux-system
  releaseName: local-path-provisioner
  targetNamespace: rancher
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    storageClass:
      defaultClass: true
