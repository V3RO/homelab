apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cni
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: cni
      version: "1.27.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  releaseName: cni
  targetNamespace: istio-system
  install:
    createNamespace: true
  dependsOn:
    - name: namespaces
      namespace: flux-system
    - name: base
      namespace: flux-system
  values:
    profile: ambient
