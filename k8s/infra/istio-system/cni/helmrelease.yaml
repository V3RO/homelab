apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cni
  namespace: flux-system
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: cni
      version: "1.27.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  releaseName: cni
  targetNamespace: istio-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    crds: CreateReplace
  dependsOn:
    - name: base
      namespace: flux-system
  values:
    profile: ambient
