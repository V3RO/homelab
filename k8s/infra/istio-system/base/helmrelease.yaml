apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: base
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: base
      version: "1.27.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  releaseName: base
  targetNamespace: istio-system
  install:
    createNamespace: true
  dependsOn:
    - name: namespaces
      namespace: flux-system
  values:

