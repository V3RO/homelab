# Homelab tradeoff (deliberate): reuses the same VersityGW root/admin
# credential already used everywhere else in this cluster for CNPG backups,
# rather than a bucket-scoped IAM key. This also sidesteps a circularity
# risk: OpenBao's own backup/restore credential must NOT depend on OpenBao
# itself being alive (e.g. a dynamic VersityGW credential minted by OpenBao's
# own secrets engine), since during a real disaster there'd be no OpenBao
# available to mint it. Revisit with a bucket-scoped key if/when a custom
# secrets-engine plugin exists for VersityGW's admin API.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-backup-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: bitwarden-app-secrets
    kind: ClusterSecretStore
  target:
    name: openbao-backup-credentials
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: versitygw-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: versitygw-secret-access-key
