apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: ./k8s/infra/openbao/openbao
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  releaseName: openbao
  targetNamespace: openbao
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    crds: CreateReplace
  values:
    openbao:
      # Vault Agent Injector is not used — secrets are delivered into pods via
      # External Secrets Operator, same as everywhere else in this cluster.
      # Running both would be two competing injection mechanisms.
      injector:
        enabled: false

      server:
        ha:
          enabled: true
          replicas: 3
          raft:
            enabled: true
            setNodeId: true
            # Note: config is stored in a ConfigMap, so nothing sensitive goes
            # here directly.
            config: |
              ui = true

              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
                telemetry {
                  unauthenticated_metrics_access = "true"
                }
              }

              storage "raft" {
                path = "/openbao/data"
              }

              # No seal stanza — plain Shamir seal (the default). Unsealing
              # is a manual, operator-run process (bao operator init/unseal);
              # the resulting unseal keys and root token are generated and
              # stored by the operator, not managed by this chart.

              service_registration "kubernetes" {}

              telemetry {
                disable_hostname = true
              }

              # NOTE: an "audit" declarative stanza + server.auditStorage was
              # tried here and reverted — adding a new volumeClaimTemplate to
              # an already-running StatefulSet is a forbidden in-place update
              # in Kubernetes (volumeClaimTemplates is immutable post-create).
              # It also put the OrderedReady StatefulSet controller into a
              # stuck retry loop trying to patch the existing openbao-0 pod,
              # which blocked openbao-1 from being recreated at all —
              # briefly leaving the raft cluster at bare quorum (2 of 3).
              # Re-adding this needs a deliberate maintenance-window
              # procedure (see BOOTSTRAP.md), not a plain Flux reconcile.

        dataStorage:
          enabled: true
          size: 5Gi
          storageClass: local-path

        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

      ui:
        enabled: true

      # Daily raft snapshot -> VersityGW S3, using the openbao-backups bucket
      # and the reused VersityGW root credential (see external-secret.yaml
      # and BOOTSTRAP.md for the tradeoff rationale).
      snapshotAgent:
        enabled: true
        schedule: "0 3 * * *"
        s3CredentialsSecret: openbao-backup-credentials
        config:
          s3Host: "versitygw.versitygw.svc.cluster.local:7070"
          s3Bucket: "openbao-backups"
          s3Uri: "s3://openbao-backups"
          s3ExpireDays: "14"
          # Plain HTTP, path-style addressing — matches how VersityGW is
          # accessed internally everywhere else in this cluster (see the
          # CNPG barman-cloud ObjectStores).
          s3cmdExtraFlag: "--no-ssl --host-bucket="
          baoAuthPath: "kubernetes"
          baoRole: "openbao-snapshot"
