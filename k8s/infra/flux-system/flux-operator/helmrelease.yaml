# The operator adopts the bootstrap helm release installed by tofu (same
# release name/namespace), making the operator itself git-managed after the
# initial cluster bootstrap.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: flux-operator
      version: "0.58.0"
      sourceRef:
        kind: HelmRepository
        name: controlplaneio-fluxcd
        namespace: flux-system
  releaseName: flux-operator
  targetNamespace: flux-system
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    crds: CreateReplace
