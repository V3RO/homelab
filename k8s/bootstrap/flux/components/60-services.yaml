apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  path: ./k8s/infra/authentik/authentik
  prune: true
  dependsOn:
    - name: namespaces
    # authentik-postgres Cluster CR
    - name: cnpg-operator
    # ScheduledBackup/ObjectStore CRs and local-path PostgreSQL PVCs
    - name: barman-cloud
    - name: local-path-provisioner
    # credential ExternalSecrets
    - name: external-secrets-config
    # HTTPRoute targets the internal Gateway
    - name: gateway
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: authentik
      namespace: flux-system
---
