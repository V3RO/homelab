apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  path: ./k8s/infra/istio-ingress-internal/gateway
  prune: true
  dependsOn:
    - name: namespaces
    # istiod programs the Gateway
    - name: istiod
    # TLS Certificates reference the cloudflare-letsencrypt ClusterIssuer
    - name: cloudflare-issuer
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gateway
      namespace: flux-system
---
