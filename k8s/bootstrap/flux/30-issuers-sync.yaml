apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-issuers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  path: ./k8s/infra/30-issuers
  prune: false
  wait: true
  dependsOn:
    - name: infra-controllers
      namespace: flux-system
