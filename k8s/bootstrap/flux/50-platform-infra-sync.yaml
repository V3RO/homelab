apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-platform-infra
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  path: ./k8s/infra/50-platform-infra
  prune: false
  wait: true
  dependsOn:
    - name: infra-storage
      namespace: flux-system
