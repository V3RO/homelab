apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-storage
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  path: ./k8s/infra/40-storage
  prune: true
  wait: true
  dependsOn:
    - name: infra-issuers
      namespace: flux-system
