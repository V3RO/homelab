image:
  repository: ghcr.io/raydak-labs/configarr
  tag: "1.30.2-alpine3.22"
  pullPolicy: IfNotPresent

schedule: "0 * * * *"
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 1
backoffLimit: 1
ttlSecondsAfterFinished: 3600
restartPolicy: Never

env:
  TZ: Europe/Vienna

networkPolicy:
  enabled: true

config:
  sonarr:
    baseUrl: http://sonarr.media.svc.cluster.local
    downloadClientName: qBittorrent
    category: tv
    rootFolders:
      - /data/media/tv
    # TRaSH-Guides quality profile: WEB-2160p
    profile:
      name: WEB-2160p
      trashId: d1498e7d189fbe6c7110ceaabb7473e6
    # Cloned profile with German language boost, assign to German-only series
    germanProfile:
      name: WEB-2160p (German)
  radarr:
    baseUrl: http://radarr.media.svc.cluster.local
    downloadClientName: qBittorrent
    category: movies
    rootFolders:
      - /data/media/movies
    # TRaSH-Guides quality profile: UHD Bluray + WEB
    profile:
      name: UHD Bluray + WEB
      trashId: 64fb5f9858489bdac2af690e27c8f42f
    # Cloned profile with German language boost, assign to German-only movies
    germanProfile:
      name: UHD Bluray + WEB (German)
  qbittorrent:
    host: qbittorrent.media.svc.cluster.local
    port: 80
    useSsl: false
    urlBase: /

externalSecret:
  enabled: true
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-app-secrets
    kind: ClusterSecretStore
  keys:
    sonarrApiKey: sonarr-api-key
    radarrApiKey: radarr-api-key
    qbittorrentApiKey: qbittorrent-api-key
