image:
  repository: ghcr.io/raydak-labs/configarr
  tag: "1.30.2-alpine3.22"
  pullPolicy: IfNotPresent

schedule: "0 0 * * *"
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 1
backoffLimit: 1
ttlSecondsAfterFinished: 3600
restartPolicy: Never

env:
  TZ: Europe/Vienna

networkPolicy:
  enabled: true

config:
  sonarr:
    baseUrl: http://sonarr.media.svc.cluster.local
    downloadClientName: qBittorrent
    category: tv
    rootFolders:
      - /data/media/tv
    # TRaSH-Guides quality profile: WEB-2160p (Combined) - 1080p fallback + 4K upgrade
    profile:
      name: WEB-2160p (Combined)
      trashId: c4cadd6b35b95f62c3d47a408e53e2f7
    # Cloned profile with German language boost, assign to German-only series
    germanProfile:
      name: WEB-2160p (Combined) (German)
  radarr:
    baseUrl: http://radarr.media.svc.cluster.local
    downloadClientName: qBittorrent
    category: movies
    rootFolders:
      - /data/media/movies
    # TRaSH-Guides quality profile: WEBDL 2160p (Combined) - WEB-only, 1080p fallback + 4K upgrade
    profile:
      name: WEBDL 2160p (Combined)
      trashId: 05fbf054ac8ad0303335026cc2632f1a
    # Cloned profile with German language boost, assign to German-only movies
    germanProfile:
      name: WEBDL 2160p (Combined) (German)
  qbittorrent:
    host: qbittorrent.media.svc.cluster.local
    port: 80
    useSsl: false
    urlBase: /

externalSecret:
  enabled: true
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-app-secrets
    kind: ClusterSecretStore
  keys:
    sonarrApiKey: sonarr-api-key
    radarrApiKey: radarr-api-key
    qbittorrentApiKey: qbittorrent-api-key
