# --- Upstream jellyfin chart values (nested under `jellyfin:` dependency key) ---
jellyfin:
  deploymentStrategy:
    type: Recreate
  service:
    port: 80
  persistence:
    config:
      existingClaim: jellyfin-config
    media:
      enabled: false
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: media-data
  volumeMounts:
    - name: data
      mountPath: /data
      readOnly: true
  jellyfin:
    env:
      - name: JELLYFIN_PublishedServerUrl
        value: https://jellyfin.schober.dev

# --- Custom template values (platform integration) ---

# Config PVC (managed by custom template)
persistence:
  config:
    enabled: true
    create: true
    claimName: jellyfin-config
    size: 10Gi
    storageClass: longhorn

app:
  host: jellyfin.schober.dev
  gateway:
    name: internal-gateway
    namespace: istio-ingress-internal
    sectionName: https
  backendServiceName: jellyfin
  servicePort: 80
  authentik:
    enabled: false
    provider: authentik

externalSecret:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-app-secrets
    kind: ClusterSecretStore
  keys:
    ldapBindPassword: authentik-user-jellyfin-ldap-password
