{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.clusterName }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.imageName }}
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.postgres.storage.size }}
      {{- with .Values.postgres.storage.class }}
      storageClassName: {{ . }}
      {{- end }}
      {{- with .Values.postgres.storage.volumeName }}
      volumeName: {{ . }}
      {{- end }}
  managed:
    roles:
      - name: {{ .Values.postgres.owner }}
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-{{ .Values.postgres.owner }}-credentials
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-versitygw-store
        # Defaults to the cluster name, so a re-created cluster inherits the
        # previous one's barman catalog. barman then refuses to archive,
        # because the system identifier no longer matches, and the cluster
        # sits at ContinuousArchivingFailing with no WAL shipped at all.
        #
        # Bump this whenever the cluster is initialised from scratch rather
        # than restored. Leave the old prefix alone -- it ages out via the
        # ObjectStore retentionPolicy, and until it does it is the only copy
        # of the previous database.
        serverName: {{ .Values.postgres.backup.serverName | default .Values.postgres.clusterName }}
{{- end }}
