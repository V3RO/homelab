{{- $postgres := default dict .Values.postgres -}}
{{- if (default false (get $postgres "enabled")) }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ default "mealie-postgres" (get $postgres "clusterName") }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ default 1 (get $postgres "instances") }}
  imageName: {{ get $postgres "imageName" }}
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: {{ default "10Gi" (get (default dict (get $postgres "storage")) "size") }}
      {{- with (get (default dict (get $postgres "storage")) "class") }}
      storageClassName: {{ . }}
      {{- end }}
      {{- with (get (default dict (get $postgres "storage")) "volumeName") }}
      volumeName: {{ . }}
      {{- end }}
  managed:
    roles:
      - name: {{ default "mealie" (get $postgres "owner") }}
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-{{ default "mealie" (get $postgres "owner") }}-credentials
  bootstrap:
    initdb:
      database: {{ default "mealie" (get $postgres "database") }}
      owner: {{ default "mealie" (get $postgres "owner") }}
  backup:
    schedule: "0 4 * * *"
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://cnpg-backups/mealie/"
      endpointURL: "https://s3.versitygw.schober.dev"
      s3Credentials:
        accessKeyId:
          name: cnpg-mealie-backup-credentials
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-mealie-backup-credentials
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: "gzip"
        maxParallel: 8
{{- end }}
