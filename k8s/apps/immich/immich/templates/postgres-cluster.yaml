{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.clusterName }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.imageName }}
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.postgres.storage.size }}
      {{- with .Values.postgres.storage.class }}
      storageClassName: {{ . }}
      {{- end }}
      {{- with .Values.postgres.storage.volumeName }}
      volumeName: {{ . }}
      {{- end }}
  postgresql:
    shared_preload_libraries:
      {{- toYaml .Values.postgres.sharedPreloadLibraries | nindent 6 }}
  managed:
    roles:
      - name: {{ .Values.postgres.owner }}
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-{{ .Values.postgres.owner }}-credentials
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
      postInitApplicationSQL:
        {{- toYaml .Values.postgres.postInitSQL | nindent 8 }}
  backup:
    schedule: "0 4 * * *"
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://cnpg-backups/immich/"
      endpointURL: "https://s3.versitygw.schober.dev"
      s3Credentials:
        accessKeyId:
          name: cnpg-immich-backup-credentials
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-immich-backup-credentials
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: "gzip"
        maxParallel: 8
{{- end }}
